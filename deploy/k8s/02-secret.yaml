apiVersion: v1
kind: Secret
metadata:
  name: ztag-gateway-secrets
  namespace: ztag
type: Opaque
stringData:
  # Nothing usable is committed here. Replace both values before applying, or
  # delete this file and create the Secret out of band (SealedSecrets,
  # External Secrets, Vault, or: kubectl create secret generic).
  #
  #   kubectl -n ztag create secret generic ztag-gateway-secrets \
  #     --from-literal=ZTAG_JWT_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=ZTAG_ADMIN_TOKEN="$(openssl rand -hex 24)"
  ZTAG_JWT_SECRET: "<generate-with-openssl-rand-hex-32>"
  ZTAG_ADMIN_TOKEN: "<generate-with-openssl-rand-hex-24>"
