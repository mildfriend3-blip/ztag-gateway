apiVersion: v1
kind: Namespace
metadata:
  name: ztag
  labels:
    name: ztag
    # Enforce the restricted Pod Security Standard: no privileged pods, no host
    # namespaces, no root. The gateway image is distroless and non-root anyway.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
