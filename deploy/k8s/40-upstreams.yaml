apiVersion: v1
kind: List
items:
  # Stand-in internal services. In the real system these are the existing
  # microservices; they are here so the topology is runnable end to end.
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: orders
      namespace: ztag
      labels:
        app: orders
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: orders
      template:
        metadata:
          labels:
            app: orders
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orders
              image: ghcr.io/example/ztag-gateway:0.1.0
              command: ["/usr/local/bin/ztag-echo"]
              args: ["-addr=:9000", "-service=orders"]
              ports:
                - containerPort: 9000
                  name: http
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 9000
                periodSeconds: 5
  - apiVersion: v1
    kind: Service
    metadata:
      name: orders
      namespace: ztag
    spec:
      selector:
        app: orders
      ports:
        - name: http
          port: 9000
          targetPort: 9000
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth
      namespace: ztag
      labels:
        app: auth
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: auth
      template:
        metadata:
          labels:
            app: auth
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auth
              image: ghcr.io/example/ztag-gateway:0.1.0
              command: ["/usr/local/bin/ztag-echo"]
              args: ["-addr=:9000", "-service=auth"]
              ports:
                - containerPort: 9000
                  name: http
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  - apiVersion: v1
    kind: Service
    metadata:
      name: auth
      namespace: ztag
    spec:
      selector:
        app: auth
      ports:
        - name: http
          port: 9000
          targetPort: 9000
